# The moonshine part of the LeanVOA library on Lean v4.35, with AxiomMath's CFSG library as a dependency.
# Its sources are the import closure of `VOA.Moonshine` and `VOA.Moonshine.MoonshineLRCFSGBridge`, ported from the
# Lean v4.30 library in the parent directory. See README.md in this directory.
name = "VOA"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["VOA"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "b63f6e8a68d220e3b3bc4f3792bb53650d375f24"

# AxiomMath's CFSG library. The moonshine files use CFSG's Monster structures (`Code.F4`, `Spin.SpinCoord`,
# `Code.Parker`), its Golay code `Code.C` and its map `SpinLattice.phi0`, so that the Monster `AutO` of this library
# is definitionally CFSG's; `MoonshineLRCFSGBridge` imports CFSG's proof of `Gmat = AutO`.
[[require]]
name = "cfsg"
git = "https://github.com/AxiomMath/CFSG"
rev = "5437cdc31389dd9aeaa5c2a9465a4e164f8dea33"

[[lean_lib]]
name = "VOA"
roots = ["VOA.Moonshine", "VOA.Moonshine.MoonshineLRCFSGBridge"]
